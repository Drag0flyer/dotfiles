general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
}

# Arrière-plan dynamique (capture d'écran floutée avec effet glassmorphism)
background {
    monitor =
    path = screenshot
    color = rgba(26, 27, 38, 1.0)
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.05
}

# Horloge principale (Heure)
label {
    monitor =
    text = $TIME
    color = rgba(248, 248, 242, 1.0)
    font_size = 90
    font_family = Fira Code Retina
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
}

# Message d'accueil / Utilisateur
label {
    monitor =
    text = Bonjour, <span foreground="##ff79c6"><b>$USER</b></span>
    color = rgba(169, 177, 214, 1.0)
    font_size = 20
    font_family = Fira Code
    position = 0, 60
    halign = center
    valign = center
}

# Champ de saisie du mot de passe
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    rounding = 12

    # Couleurs du champ
    inner_color = rgba(26, 27, 38, 0.85)
    outer_color = rgba(255, 121, 198, 0.8)
    font_color = rgba(248, 248, 242, 1.0)
    font_family = Fira Code

    # Retours visuels d'état
    check_color = rgba(80, 250, 123, 0.9)
    fail_color = rgba(255, 85, 85, 0.9)
    capslock_color = rgba(255, 184, 108, 0.9)

    fade_on_empty = false
    placeholder_text = <span foreground="##6272a4"><i>Mot de passe...</i></span>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    position = 0, -40
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)
}
