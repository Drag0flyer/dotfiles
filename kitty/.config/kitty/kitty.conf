shell_integration no-rc
allow_remote_control no


# BEGIN_KITTY_FONTS
font_family      family="Fira Code"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B1,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF,U+F0001-U+F1AF0 Symbols Nerd Font Mono

# Opacité de l'arrière-plan (0.0 = invisible, 1.0 = opaque)
background_opacity 0.60

# Flou d'arrière-plan sous Wayland/KDE/Hyprland (optionnel)
background_blur 0

confirm_os_window_close -1

# Ne PAS considérer ces shells/processus de base comme bloquants
close_window_on_child_death yes

shell_integration enabled
